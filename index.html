<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nekos APIs</title>
  </head>
  <body>
    <main class="container">
      <section>
        <div class="section-head">
          <h2>Surprise me</h2>
          <div class="provider-picker">
            <img id="provider-logo" alt="" />
            <select id="provider">
              <option value="nekos-best">nekos.best</option>
              <option value="nekosapi">nekosapi</option>
            </select>
          </div>
        </div>
        <button id="surprise-btn">Get random image</button>
        <div id="surprise-result" class="result"></div>
      </section>

      <section>
        <h2>Search</h2>
        <form id="search-form">
          <div id="best-search-fields" class="field-group">
            <label>
              Query
              <input name="query" placeholder="e.g. artist name or anime" required />
            </label>
            <label>
              Type
              <select name="type">
                <option value="1">Images</option>
                <option value="2">GIFs</option>
              </select>
            </label>
            <label>
              Category
              <select name="category">
                <option value="">any</option>
              </select>
            </label>
            <label>
              Amount (1-20)
              <input name="amount" type="number" min="1" max="20" value="10" />
            </label>
          </div>
          <div id="nekosapi-search-fields" class="field-group" hidden>
            <label>
              Tags (comma-delimited)
              <input name="tags" placeholder="blonde_hair, girl" />
            </label>
            <label>
              Rating
              <select name="rating">
                <option value="safe" selected>safe</option>
                <option value="suggestive">suggestive</option>
                <option value="borderline">borderline</option>
                <option value="explicit">explicit</option>
              </select>
            </label>
            <label>
              Limit (1-100)
              <input name="limit" type="number" min="1" max="100" value="10" />
            </label>
          </div>
          <button type="submit">Search</button>
        </form>
        <div id="search-result" class="result"></div>
      </section>

      <section>
        <h2>Get specific item</h2>
        <form id="asset-form">
          <div id="best-asset-fields" class="field-group">
            <label>
              Category
              <select name="category">
                <option value="">loading…</option>
              </select>
            </label>
            <label>
              Filename (UUID)
              <input name="filename" placeholder="xxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" required />
            </label>
            <label>
              Format
              <select name="format">
                <option value="png">png</option>
                <option value="gif">gif</option>
              </select>
            </label>
            <button type="button" id="random-filename-btn">Use a random filename</button>
          </div>
          <div id="nekosapi-asset-fields" class="field-group" hidden>
            <label>
              Image ID
              <input name="id" type="number" placeholder="5845" required />
            </label>
          </div>
          <button type="submit">Fetch</button>
        </form>
        <p class="meta">
          nekos.best: filenames come from the <code>url</code> of any result &mdash; run a
          Search or Surprise me, then copy the UUID part. nekosapi: paste an image ID from a
          search result.
        </p>
        <div id="asset-result" class="result"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
